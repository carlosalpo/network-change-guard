! Sanitized, reduced capture from the dedicated synthetic IOSv lab.
version 15.9
hostname branch-lab
username labadmin privilege 15 secret 5 SYNTHETIC-NONFUNCTIONAL-HASH
ip ssh version 2
!
interface Loopback0
 description Synthetic lab interface
 ip address 198.19.0.1 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 shutdown
 ip address 192.0.2.11 255.255.255.0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/1
 description Synthetic lab interface
 ip address 198.18.0.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 ip ospf cost 10
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/2
 description Synthetic lab interface
 ip address 198.18.0.9 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 ip ospf cost 100
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/3
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
router ospf 1
 router-id 198.19.0.1
 passive-interface default
 no passive-interface GigabitEthernet0/1
 no passive-interface GigabitEthernet0/2
!
line vty 0 4
 login local
 transport input ssh
!
end
