[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "network-change-guard"
version = "0.1.0"
description = "Review Cisco IOS configuration snapshots against explicit change guardrails."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Carlos Alvarado"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
ncg = "changeguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
