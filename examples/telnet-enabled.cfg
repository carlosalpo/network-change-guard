! Synthetic documentation fixture, not a production backup.
version 15.9
hostname branch-lab
no service password-encryption
username labadmin privilege 15 secret 5 SYNTHETIC-NONFUNCTIONAL-HASH
ip ssh version 2
!
interface GigabitEthernet0/0
 description Isolated management
 ip address 192.0.2.11 255.255.255.0
!
interface GigabitEthernet0/1
 description Primary lab path
 ip address 198.18.0.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 ip ospf cost 10
!
interface Loopback0
 ip address 198.19.0.1 255.255.255.255
 ip ospf 1 area 0
!
router ospf 1
 router-id 198.19.0.1
 passive-interface default
 no passive-interface GigabitEthernet0/1
!
ip route 203.0.113.0 255.255.255.0 198.18.0.2
!
line vty 0 4
 login local
 transport input ssh telnet
!
end
